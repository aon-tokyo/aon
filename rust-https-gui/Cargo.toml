[package]
name = "rust-https-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
indexmap = "=2.2.6"
poem = "=2.0.1"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["full"] }
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
